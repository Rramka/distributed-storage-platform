name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -short -count=1

  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsp
          POSTGRES_PASSWORD: dsp
          POSTGRES_DB: dsp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsp -d dsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://dsp:dsp@localhost:5432/dsp?sslmode=disable
      REDIS_URL: redis://localhost:6379
      DSP_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Apply migrations
        run: ./scripts/apply-migrations.sh "$POSTGRES_URL"
      - name: Invariant and red-team tests
        run: go test ./... -count=1
