name: dsp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dsp
      POSTGRES_PASSWORD: dsp
      POSTGRES_DB: dsp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsp -d dsp"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SERVICE: gateway
    environment:
      HTTP_ADDR: ":8080"
      REDIS_URL: redis://redis:6379
      METADATA_URL: http://metadata:8081
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      metadata:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  metadata:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SERVICE: metadata
    environment:
      HTTP_ADDR: ":8081"
      POSTGRES_URL: postgres://dsp:dsp@postgres:5432/dsp?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scheduler:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SERVICE: scheduler
    environment:
      HTTP_ADDR: ":8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  healthmon:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SERVICE: healthmon
    environment:
      HTTP_ADDR: ":8083"
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  repair:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      args:
        SERVICE: repair
    environment:
      HTTP_ADDR: ":8084"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
