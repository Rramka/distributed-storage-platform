      ENDPOINT: 127.0.0.1:7466
    volumes:
      - ca_data:/ca:ro
      - seed_data:/seed:ro
      - agent24_data:/data
    ports:
      - "7466:7443"
      - "9024:9000"
    depends_on:
      fleet-seed:
        condition: service_completed_successfully
      healthmon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

